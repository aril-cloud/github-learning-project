<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MATRIX</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <div class="container">
        <h1>THE MATRIX</h1>
        <p class="instructions">ACCEPT or REJECT the simulation</p>

        <div class="card-container">
            <div class="card" data-id="1">
                <div class="card-content">
                    <h2>RED PILL</h2>
                    <p>Wake up from the simulation</p>
                    <span class="emoji">💊</span>
                </div>
            </div>
            <div class="card" data-id="2">
                <div class="card-content">
                    <h2>BLUE PILL</h2>
                    <p>Stay in wonderland</p>
                    <span class="emoji">💊</span>
                </div>
            </div>
            <div class="card" data-id="3">
                <div class="card-content">
                    <h2>FOLLOW THE WHITE RABBIT</h2>
                    <p>Down the rabbit hole</p>
                    <span class="emoji">🐰</span>
                </div>
            </div>
            <div class="card" data-id="4">
                <div class="card-content">
                    <h2>THERE IS NO SPOON</h2>
                    <p>Free your mind</p>
                    <span class="emoji">🥄</span>
                </div>
            </div>
            <div class="card" data-id="5">
                <div class="card-content">
                    <h2>THE ONE</h2>
                    <p>You are the chosen one</p>
                    <span class="emoji">🕶️</span>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-nope" id="nope">✕</button>
            <button class="btn btn-like" id="like">♥</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
