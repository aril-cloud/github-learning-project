<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipeable Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Swipeable Cards</h1>
        <p class="instructions">Swipe right to like, swipe left to pass</p>

        <div class="card-container">
            <div class="card" data-id="1">
                <div class="card-content">
                    <h2>Card 1</h2>
                    <p>This is the first card. Swipe me!</p>
                    <span class="emoji">🎨</span>
                </div>
            </div>
            <div class="card" data-id="2">
                <div class="card-content">
                    <h2>Card 2</h2>
                    <p>Here's another card to swipe.</p>
                    <span class="emoji">🚀</span>
                </div>
            </div>
            <div class="card" data-id="3">
                <div class="card-content">
                    <h2>Card 3</h2>
                    <p>Keep swiping!</p>
                    <span class="emoji">⚡</span>
                </div>
            </div>
            <div class="card" data-id="4">
                <div class="card-content">
                    <h2>Card 4</h2>
                    <p>Almost there...</p>
                    <span class="emoji">🌟</span>
                </div>
            </div>
            <div class="card" data-id="5">
                <div class="card-content">
                    <h2>Card 5</h2>
                    <p>Last card!</p>
                    <span class="emoji">🎉</span>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-nope" id="nope">✕</button>
            <button class="btn btn-like" id="like">♥</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
